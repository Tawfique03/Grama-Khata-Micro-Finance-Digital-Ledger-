# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Increase memory for Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Fix for jlink.exe error with spaces in paths
# This disables the modular JDK image transform which fails with spaces in the path
android.jdkImageTransform.enabled=false
android.useJdkImage=false
android.jdk.category=legacy
android.experimental.run-jdk-image-transform-in-process=true

# Ensure we use full classpath to avoid other path-related issues
android.useFullClasspathForDexing=true
