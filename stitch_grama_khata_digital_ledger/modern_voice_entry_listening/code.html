<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mic-glow {
            box-shadow: 0 0 40px 10px rgba(96, 99, 238, 0.2);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#c3c0ff",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#4648d4",
                        "tertiary-fixed-dim": "#ffb694",
                        "primary": "#1f108e",
                        "on-error-container": "#93000a",
                        "surface": "#fcf8ff",
                        "outline": "#777584",
                        "surface-bright": "#fcf8ff",
                        "on-tertiary-fixed-variant": "#7a3003",
                        "surface-tint": "#544fc0",
                        "on-surface-variant": "#464553",
                        "surface-container-highest": "#e4e1eb",
                        "surface-container-low": "#f6f2fc",
                        "surface-dim": "#dcd8e3",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "on-secondary-fixed": "#07006c",
                        "on-primary-container": "#a9a7ff",
                        "inverse-surface": "#303037",
                        "secondary-fixed-dim": "#c0c1ff",
                        "tertiary-container": "#752c00",
                        "on-primary-fixed-variant": "#3b35a7",
                        "on-tertiary-container": "#fe9562",
                        "tertiary": "#511c00",
                        "surface-variant": "#e4e1eb",
                        "on-surface": "#1b1b22",
                        "secondary-container": "#6063ee",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "inverse-on-surface": "#f3eff9",
                        "primary-container": "#3730a3",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-container-high": "#eae6f1",
                        "outline-variant": "#c8c4d5",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "background": "#fcf8ff",
                        "on-tertiary-fixed": "#351000",
                        "surface-container": "#f0ecf6",
                        "secondary-fixed": "#e1e0ff",
                        "on-background": "#1b1b22",
                        "on-primary-fixed": "#0f0069",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "sm": "12px",
                        "lg": "24px",
                        "base": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "label-lg": ["Public Sans"],
                        "display": ["Public Sans"],
                        "label-sm": ["Public Sans"],
                        "body-lg": ["Public Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md z-50">
<div class="flex justify-between items-center px-margin-mobile py-base w-full max-w-7xl mx-auto">
<div class="active:scale-95 transition-transform duration-200">
<img alt="shopkeeper profile" class="w-10 h-10 rounded-full border-2 border-primary-fixed" data-alt="A professional studio portrait of a friendly South Asian shopkeeper with a warm smile, set against a soft-focus background of a tidy, modern grocery store. The lighting is bright and inviting, maintaining the clean, light-mode aesthetic of the application with high-key whites and soft indigo shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDki9MFfiHCUrJrdVRMXFMpnQlAOKwBduDa__H-anYHqRhqZUjbSgGvVXF_BwTVGLLEJcrgCmx_fVf131JOv4Z0uHpyU86mycG-T9nlwhmoV368jLN-cH-CAWXBiXHsJSu0VHUS2daOiV6wpa5WHPdNelwhNxEGzaaZU9NWvAeslNI56PAcwpzD24yLqXyZyTNcUy_fyIb8gk_VJAFLiOuga9HUagAQo9z9k5xDQqLYAAMqwC9wDClZCx1DaExKcBmN4HTjvjqSajan"/>
</div>
<h1 class="text-headline-lg font-display text-primary dark:text-primary-fixed-dim">Grama-Khata</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[28px]" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Content: Voice Interaction Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Voice Status Header -->
<div class="text-center mb-xl">
<h2 class="font-headline-md text-headline-md text-primary mb-xs">Voice Entry</h2>
<p class="font-body-md text-on-surface-variant">Speak naturally to record a transaction</p>
</div>
<!-- Central Mic Button -->
<div class="relative flex items-center justify-center mb-xl">
<!-- Pulsing outer circles for animation effect -->
<div class="absolute w-48 h-48 bg-primary/5 rounded-full"></div>
<div class="absolute w-40 h-40 bg-primary/10 rounded-full"></div>
<button class="relative w-32 h-32 bg-secondary-container rounded-full flex items-center justify-center mic-glow active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Listening Status & Wave Pattern -->
<div class="flex flex-col items-center gap-md mb-xl">
<span class="font-label-lg text-primary tracking-widest uppercase">Listening...</span>
<div class="flex items-end gap-1.5 h-12">
<div class="w-1.5 h-6 bg-secondary-container rounded-full"></div>
<div class="w-1.5 h-10 bg-primary rounded-full"></div>
<div class="w-1.5 h-4 bg-secondary-container rounded-full"></div>
<div class="w-1.5 h-8 bg-primary rounded-full"></div>
<div class="w-1.5 h-6 bg-secondary-container rounded-full"></div>
<div class="w-1.5 h-10 bg-primary rounded-full"></div>
<div class="w-1.5 h-4 bg-secondary-container rounded-full"></div>
</div>
</div>
<!-- Live Transcript Card -->
<div class="w-full max-w-md bg-surface-container-low rounded-xl p-lg shadow-[0px_2px_10px_rgba(0,0,0,0.04)] mb-xl">
<div class="flex items-center gap-xs mb-sm">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="description">description</span>
<h3 class="font-label-lg text-primary">Live Transcript</h3>
</div>
<div class="min-h-[80px]">
<p class="font-body-lg text-on-surface leading-relaxed italic">
                    "Ramesh took <span class="font-bold text-primary">5kg sugar</span> for <span class="font-bold text-secondary">250 rupees</span>..."
                </p>
</div>
<div class="mt-md pt-md border-t border-outline-variant flex justify-between items-center">
<span class="font-label-sm text-outline">English/Kannada Detected</span>
<button class="font-label-lg text-error hover:opacity-80 transition-opacity">Cancel</button>
</div>
</div>
<!-- Helpful Suggestion -->
<div class="flex items-center gap-sm bg-surface-container-high/50 px-md py-sm rounded-full">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="lightbulb">lightbulb</span>
<p class="font-label-sm text-on-surface-variant">Try saying: "Sunita paid 500 for old dues"</p>
</div>
</main>
<!-- Bottom Action Area -->
<div class="px-margin-mobile pb-xl pt-md bg-surface flex flex-col gap-md">
<button class="w-full h-12 bg-primary text-on-primary rounded-xl font-label-lg shadow-[0px_8px_20px_rgba(31,16,142,0.15)] active:scale-95 transition-transform">
            Done Recording
        </button>
</div>
<!-- BottomNavBar (Suppressed for focused task, but kept logic for structure if needed) -->
<!-- The BottomNavBar is intentionally suppressed to prioritize the voice recording journey as per the "Task-Focused" rule. -->
</body></html>
